<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词背诵助手</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/edge-tts@latest/dist/edge-tts.min.js"></script>
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="单词背诵">
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app" class="max-w-md mx-auto px-4 py-6">
        <!-- 顶部导航 -->
        <header class="mb-6">
            <h1 id="page-title" class="text-2xl font-bold text-center text-blue-600">单词背诵助手</h1>
            <button id="back-btn" class="hidden absolute top-6 left-4 text-xl text-blue-600">← 返回</button>
        </header>

        <!-- 首页 -->
        <div id="home-page" class="page">
            <!-- 列表选择 -->
            <div class="mb-6">
                <label class="block text-lg font-medium mb-2">选择单词列表</label>
                <select id="list-select" class="w-full p-3 border border-gray-300 rounded-lg text-lg">
                    <option value="">暂无列表</option>
                </select>
            </div>

            <button id="new-list-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg text-lg mb-8">
                新建单词列表
            </button>

            <!-- 功能按钮网格 -->
            <div class="grid grid-cols-2 gap-4">
                <button class="bg-green-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="goToPage('add-word')">
                    <span class="text-4xl mb-2">➕</span>
                    <span class="text-lg">添加单词</span>
                </button>
                <button class="bg-blue-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="startECTest()">
                    <span class="text-4xl mb-2">🔤</span>
                    <span class="text-lg">英译汉</span>
                </button>
                <button class="bg-orange-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="startCETest()">
                    <span class="text-4xl mb-2">✍️</span>
                    <span class="text-lg">汉译英</span>
                </button>
                <button class="bg-red-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="goToPage('mistakes')">
                    <span class="text-4xl mb-2">❌</span>
                    <span class="text-lg">错题库</span>
                </button>
                <button class="bg-purple-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="goToPage('voice-settings')">
                    <span class="text-4xl mb-2">🔊</span>
                    <span class="text-lg">语音设置</span>
                </button>
                <button class="bg-gray-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="exportData()">
                    <span class="text-4xl mb-2">💾</span>
                    <span class="text-lg">导出数据</span>
                </button>
            </div>

            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
            <button class="w-full mt-4 bg-gray-600 text-white py-3 rounded-lg text-lg" onclick="document.getElementById('import-file').click()">
                导入数据
            </button>
        </div>

        <!-- 添加单词页面 -->
        <div id="add-word-page" class="page hidden">
            <div class="space-y-4">
                <div>
                    <label class="block text-lg font-medium mb-2">英文单词</label>
                    <input type="text" id="english-input" class="w-full p-3 border border-gray-300 rounded-lg text-lg" placeholder="输入英文">
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">中文含义</label>
                    <input type="text" id="chinese-input" class="w-full p-3 border border-gray-300 rounded-lg text-lg" placeholder="输入中文">
                </div>
                <button id="add-word-btn" class="w-full bg-green-500 text-white py-3 rounded-lg text-lg mt-6">
                    添加单词
                </button>
            </div>
        </div>

        <!-- 英译汉页面 -->
        <div id="ec-page" class="page hidden">
            <p id="ec-progress" class="text-center text-lg text-blue-600 mb-8"></p>
            
            <div class="flex justify-center items-center mb-12">
                <span id="ec-word" class="text-3xl font-bold mr-4"></span>
                <button id="ec-play-btn" class="text-3xl text-blue-600">🔊</button>
            </div>

            <div id="ec-options" class="space-y-4 mb-8"></div>
            <p id="ec-feedback" class="text-center text-2xl"></p>
        </div>

        <!-- 汉译英页面 -->
        <div id="ce-page" class="page hidden">
            <p id="ce-progress" class="text-center text-lg text-blue-600 mb-8"></p>
            
            <div class="flex justify-center items-center mb-12">
                <span id="ce-word" class="text-3xl font-bold mr-4"></span>
                <button id="ce-play-btn" class="text-3xl text-blue-600">🔊</button>
            </div>

            <input type="text" id="ce-input" class="w-full p-3 border border-gray-300 rounded-lg text-lg text-center mb-6" placeholder="输入英文答案">
            <button id="ce-submit-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg text-lg mb-8">
                提交
            </button>
            <p id="ce-feedback" class="text-center text-2xl"></p>
        </div>

        <!-- 错题库页面 -->
        <div id="mistakes-page" class="page hidden">
            <div class="flex border-b border-gray-300 mb-4">
                <button id="ec-mistakes-tab" class="flex-1 py-2 text-lg font-medium text-blue-600 border-b-2 border-blue-600">
                    英译汉错题
                </button>
                <button id="ce-mistakes-tab" class="flex-1 py-2 text-lg font-medium text-gray-500">
                    汉译英错题
                </button>
            </div>
            <div id="mistakes-list" class="space-y-2"></div>
        </div>

        <!-- 语音设置页面 -->
        <div id="voice-settings-page" class="page hidden">
            <div class="space-y-8">
                <div>
                    <label class="block text-lg font-medium mb-2">语速 (-50% ~ +100%)</label>
                    <input type="range" id="rate-slider" min="-50" max="100" value="0" class="w-full">
                    <p id="rate-value" class="text-center text-lg mt-2">0%</p>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">音量 (-50% ~ +50%)</label>
                    <input type="range" id="volume-slider" min="-50" max="50" value="0" class="w-full">
                    <p id="volume-value" class="text-center text-lg mt-2">0%</p>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">语调 (-20Hz ~ +20Hz)</label>
                    <input type="range" id="pitch-slider" min="-20" max="20" value="0" class="w-full">
                    <p id="pitch-value" class="text-center text-lg mt-2">0Hz</p>
                </div>
                <button id="save-voice-btn" class="w-full bg-purple-600 text-white py-3 rounded-lg text-lg">
                    保存设置
                </button>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl p-6 w-80 mx-4">
            <h3 id="modal-title" class="text-xl font-bold mb-4"></h3>
            <div id="modal-content" class="mb-6"></div>
            <div id="modal-buttons" class="flex justify-end space-x-4"></div>
        </div>
    </div>

    <script>
        // 数据管理
        let data = {
            lists: [],
            nextId: 1,
            voiceSettings: { rate: "+0%", volume: "+0%", pitch: "+0Hz" }
        };
        let currentList = null;

        // 加载数据
        function loadData() {
            const saved = localStorage.getItem('wordLearnerData');
            if (saved) {
                data = JSON.parse(saved);
            }
            refreshListSelect();
        }

        // 保存数据
        function saveData() {
            localStorage.setItem('wordLearnerData', JSON.stringify(data));
        }

        // 刷新列表选择
        function refreshListSelect() {
            const select = document.getElementById('list-select');
            select.innerHTML = '';
            if (data.lists.length === 0) {
                select.innerHTML = '<option value="">暂无列表</option>';
                currentList = null;
                return;
            }
            data.lists.forEach(list => {
                const option = document.createElement('option');
                option.value = list.id;
                option.textContent = `${list.name} (${list.words.length}个单词)`;
                select.appendChild(option);
            });
            currentList = data.lists[0];
            select.value = currentList.id;
        }

        // 新建列表
        document.getElementById('new-list-btn').addEventListener('click', () => {
            showModal('新建单词列表', 
                '<input type="text" id="new-list-name" class="w-full p-2 border rounded-lg" placeholder="输入列表名称">',
                [
                    { text: '取消', onClick: hideModal },
                    { text: '创建', onClick: () => {
                        const name = document.getElementById('new-list-name').value.trim();
                        if (!name) return;
                        const newList = {
                            id: data.nextId++,
                            name: name,
                            words: [],
                            ecMistakes: [],
                            ceMistakes: []
                        };
                        data.lists.push(newList);
                        saveData();
                        refreshListSelect();
                        hideModal();
                        showToast('列表创建成功');
                    }}
                ]
            );
        });

        // 列表选择变化
        document.getElementById('list-select').addEventListener('change', (e) => {
            const id = parseInt(e.target.value);
            currentList = data.lists.find(l => l.id === id);
        });

        // 页面切换
        function goToPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`${pageName}-page`).classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('page-title').textContent = getPageTitle(pageName);
        }

        function goHome() {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('page-title').textContent = '单词背诵助手';
        }

        function getPageTitle(pageName) {
            const titles = {
                'add-word': '添加单词',
                'ec': '英译汉',
                'ce': '汉译英',
                'mistakes': '错题库',
                'voice-settings': '语音设置'
            };
            return titles[pageName] || '单词背诵助手';
        }

        document.getElementById('back-btn').addEventListener('click', goHome);

        // 添加单词
        document.getElementById('add-word-btn').addEventListener('click', () => {
            const english = document.getElementById('english-input').value.trim();
            const chinese = document.getElementById('chinese-input').value.trim();
            if (!english || !chinese) {
                showToast('请填写完整信息');
                return;
            }
            if (!currentList) {
                showToast('请先选择一个列表');
                return;
            }
            currentList.words.push({ english, chinese });
            saveData();
            refreshListSelect();
            document.getElementById('english-input').value = '';
            document.getElementById('chinese-input').value = '';
            showToast('单词添加成功');
        });

        // 英译汉测试
        let ecState = {
            words: [],
            mistakes: [],
            currentIndex: 0,
            phase: 'learning',
            reviewQueue: [],
            correctAnswer: '',
            options: [],
            buttonsEnabled: true
        };

        function startECTest() {
            if (!currentList) {
                showToast('请先选择一个列表');
                return;
            }
            if (currentList.words.length < 4) {
                showToast('单词数不足4个，无法生成选项');
                return;
            }
            ecState = {
                words: [...currentList.words].sort(() => Math.random() - 0.5),
                mistakes: [...currentList.ecMistakes],
                currentIndex: 0,
                phase: 'learning',
                reviewQueue: [],
                correctAnswer: '',
                options: [],
                buttonsEnabled: true
            };
            goToPage('ec');
            showECQuestion();
        }

        function showECQuestion() {
            document.getElementById('ec-feedback').textContent = '';
            ecState.buttonsEnabled = true;

            if (ecState.phase === 'learning') {
                if (ecState.currentIndex >= ecState.words.length) {
                    if (ecState.mistakes.length > 0) {
                        ecState.phase = 'review';
                        prepareECReview();
                        return;
                    } else {
                        finishTest('英译汉');
                        return;
                    }
                }
                const word = ecState.words[ecState.currentIndex];
                ecState.correctAnswer = word.chinese;
                document.getElementById('ec-word').textContent = word.english;
                document.getElementById('ec-progress').textContent = `学习进度: ${ecState.currentIndex+1}/${ecState.words.length}`;
            } else {
                if (ecState.reviewQueue.length === 0) {
                    if (ecState.mistakes.length > 0) {
                        prepareECReview();
                        return;
                    } else {
                        finishTest('英译汉');
                        return;
                    }
                }
                const [word, streak] = ecState.reviewQueue[0];
                ecState.correctAnswer = word.chinese;
                document.getElementById('ec-word').textContent = word.english;
                document.getElementById('ec-progress').textContent = `错题复习 - 剩余: ${ecState.reviewQueue.length}题`;
            }

            generateECOptions();
        }

        function generateECOptions() {
            const allChinese = currentList.words.map(w => w.chinese);
            const others = allChinese.filter(c => c !== ecState.correctAnswer);
            let choices;
            if (others.length >= 3) {
                choices = others.sort(() => Math.random() - 0.5).slice(0, 3);
            } else {
                choices = [...others, ...Array(3-others.length).fill(0).map(() => allChinese[Math.floor(Math.random()*allChinese.length)])];
            }
            ecState.options = [...choices, ecState.correctAnswer].sort(() => Math.random() - 0.5);

            const optionsDiv = document.getElementById('ec-options');
            optionsDiv.innerHTML = '';
            ecState.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-white border border-gray-300 py-4 rounded-lg text-xl';
                btn.textContent = option;
                btn.onclick = () => checkECAnswer(index);
                optionsDiv.appendChild(btn);
            });
        }

        function prepareECReview() {
            ecState.reviewQueue = ecState.mistakes.map(m => [
                { english: m.english, chinese: m.chinese },
                m.streak || 0
            ]).sort(() => Math.random() - 0.5);
            showECQuestion();
        }

        function checkECAnswer(index) {
            if (!ecState.buttonsEnabled) return;
            ecState.buttonsEnabled = false;

            const selected = ecState.options[index];
            if (selected === ecState.correctAnswer) {
                document.getElementById('ec-feedback').textContent = '✓ 回答正确！';
                document.getElementById('ec-feedback').className = 'text-center text-2xl text-green-600';
                
                if (ecState.phase === 'learning') {
                    ecState.currentIndex++;
                } else {
                    const [word, streak] = ecState.reviewQueue.shift();
                    const newStreak = streak + 1;
                    if (newStreak >= 3) {
                        ecState.mistakes = ecState.mistakes.filter(m => !(m.english === word.english && m.chinese === word.chinese));
                        document.getElementById('ec-feedback').textContent = '✓ 连续3次正确，已移出错题库！';
                    } else {
                        const mistake = ecState.mistakes.find(m => m.english === word.english && m.chinese === word.chinese);
                        mistake.streak = newStreak;
                        ecState.reviewQueue.push([word, newStreak]);
                    }
                }
                currentList.ecMistakes = ecState.mistakes;
                saveData();
                setTimeout(showECQuestion, 800);
            } else {
                document.getElementById('ec-feedback').textContent = `✗ 错误！正确答案是: ${ecState.correctAnswer}`;
                document.getElementById('ec-feedback').className = 'text-center text-2xl text-red-600';
                
                if (ecState.phase === 'learning') {
                    const word = ecState.words[ecState.currentIndex];
                    const existing = ecState.mistakes.find(m => m.english === word.english && m.chinese === word.chinese);
                    if (!existing) {
                        ecState.mistakes.push({ english: word.english, chinese: word.chinese, streak: 0 });
                    } else {
                        existing.streak = 0;
                    }
                    ecState.currentIndex++;
                } else {
                    const [word, _] = ecState.reviewQueue.shift();
                    const mistake = ecState.mistakes.find(m => m.english === word.english && m.chinese === word.chinese);
                    mistake.streak = 0;
                    ecState.reviewQueue.push([word, 0]);
                }
                currentList.ecMistakes = ecState.mistakes;
                saveData();
                setTimeout(showECQuestion, 1500);
            }
        }

        document.getElementById('ec-play-btn').addEventListener('click', () => {
            const word = document.getElementById('ec-word').textContent;
            playVoice(word);
        });

        // 汉译英测试
        let ceState = {
            words: [],
            mistakes: [],
            currentIndex: 0,
            phase: 'learning',
            reviewQueue: [],
            correctAnswer: '',
            requireCorrectInput: false,
            requiredInput: ''
        };

        function startCETest() {
            if (!currentList) {
                showToast('请先选择一个列表');
                return;
            }
            if (currentList.words.length === 0) {
                showToast('该列表没有单词');
                return;
            }
            ceState = {
                words: [...currentList.words].sort(() => Math.random() - 0.5),
                mistakes: [...currentList.ceMistakes],
                currentIndex: 0,
                phase: 'learning',
                reviewQueue: [],
                correctAnswer: '',
                requireCorrectInput: false,
                requiredInput: ''
            };
            goToPage('ce');
            showCEQuestion();
        }

        function showCEQuestion() {
            document.getElementById('ce-feedback').textContent = '';
            ceState.requireCorrectInput = false;
            document.getElementById('ce-submit-btn').textContent = '提交';
            document.getElementById('ce-input').value = '';
            document.getElementById('ce-input').focus();

            if (ceState.phase === 'learning') {
                if (ceState.currentIndex >= ceState.words.length) {
                    if (ceState.mistakes.length > 0) {
                        ceState.phase = 'review';
                        prepareCEReview();
                        return;
                    } else {
                        finishTest('汉译英');
                        return;
                    }
                }
                const word = ceState.words[ceState.currentIndex];
                ceState.correctAnswer = word.english;
                document.getElementById('ce-word').textContent = word.chinese;
                document.getElementById('ce-progress').textContent = `学习进度: ${ceState.currentIndex+1}/${ceState.words.length}`;
            } else {
                if (ceState.reviewQueue.length === 0) {
                    if (ceState.mistakes.length > 0) {
                        prepareCEReview();
                        return;
                    } else {
                        finishTest('汉译英');
                        return;
                    }
                }
                const [word, streak] = ceState.reviewQueue[0];
                ceState.correctAnswer = word.english;
                document.getElementById('ce-word').textContent = word.chinese;
                document.getElementById('ce-progress').textContent = `错题复习 - 剩余: ${ceState.reviewQueue.length}题`;
            }
        }

        function prepareCEReview() {
            ceState.reviewQueue = ceState.mistakes.map(m => [
                { english: m.english, chinese: m.chinese },
                m.streak || 0
            ]).sort(() => Math.random() - 0.5);
            showCEQuestion();
        }

        function checkCEAnswer() {
            const input = document.getElementById('ce-input').value.trim().toLowerCase();
            if (!input) return;

            if (ceState.requireCorrectInput) {
                if (input === ceState.requiredInput.toLowerCase()) {
                    document.getElementById('ce-feedback').textContent = '正确，请继续';
                    document.getElementById('ce-feedback').className = 'text-center text-2xl text-green-600';
                    setTimeout(nextCEQuestion, 800);
                } else {
                    document.getElementById('ce-feedback').textContent = `请输入正确答案: ${ceState.requiredInput}`;
                    document.getElementById('ce-feedback').className = 'text-center text-2xl text-red-600';
                    document.getElementById('ce-input').value = '';
                }
                return;
            }

            if (input === ceState.correctAnswer.toLowerCase()) {
                document.getElementById('ce-feedback').textContent = '✓ 回答正确！';
                document.getElementById('ce-feedback').className = 'text-center text-2xl text-green-600';
                
                if (ceState.phase === 'learning') {
                    ceState.currentIndex++;
                } else {
                    const [word, streak] = ceState.reviewQueue.shift();
                    const newStreak = streak + 1;
                    if (newStreak >= 3) {
                        ceState.mistakes = ceState.mistakes.filter(m => !(m.english === word.english && m.chinese === word.chinese));
                        document.getElementById('ce-feedback').textContent = '✓ 连续3次正确，已移出错题库！';
                    } else {
                        const mistake = ceState.mistakes.find(m => m.english === word.english && m.chinese === word.chinese);
                        mistake.streak = newStreak;
                        ceState.reviewQueue.push([word, newStreak]);
                    }
                }
                currentList.ceMistakes = ceState.mistakes;
                saveData();
                setTimeout(nextCEQuestion, 800);
            } else {
                document.getElementById('ce-feedback').textContent = `✗ 错误！正确答案是: ${ceState.correctAnswer}`;
                document.getElementById('ce-feedback').className = 'text-center text-2xl text-red-600';
                ceState.requireCorrectInput = true;
                ceState.requiredInput = ceState.correctAnswer;
                document.getElementById('ce-submit-btn').textContent = '输入正确答案后继续';
                document.getElementById('ce-input').value = '';
                
                if (ceState.phase === 'learning') {
                    const word = ceState.words[ceState.currentIndex];
                    const existing = ceState.mistakes.find(m => m.english === word.english && m.chinese === word.chinese);
                    if (!existing) {
                        ceState.mistakes.push({ english: word.english, chinese: word.chinese, streak: 0 });
                    } else {
                        existing.streak = 0;
                    }
                    ceState.currentIndex++;
                } else {
                    const [word, _] = ceState.reviewQueue.shift();
                    const mistake = ceState.mistakes.find(m => m.english === word.english && m.chinese === word.chinese);
                    mistake.streak = 0;
                    ceState.reviewQueue.push([word, 0]);
                }
                currentList.ceMistakes = ceState.mistakes;
                saveData();
            }
        }

        function nextCEQuestion() {
            showCEQuestion();
        }

        document.getElementById('ce-submit-btn').addEventListener('click', checkCEAnswer);
        document.getElementById('ce-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkCEAnswer();
        });

        document.getElementById('ce-play-btn').addEventListener('click', () => {
            playVoice(ceState.correctAnswer);
        });

        // 错题库
        let currentMistakeTab = 'ec';

        document.getElementById('ec-mistakes-tab').addEventListener('click', () => {
            currentMistakeTab = 'ec';
            updateMistakesTab();
        });

        document.getElementById('ce-mistakes-tab').addEventListener('click', () => {
            currentMistakeTab = 'ce';
            updateMistakesTab();
        });

        function updateMistakesTab() {
            document.getElementById('ec-mistakes-tab').className = currentMistakeTab === 'ec' 
                ? 'flex-1 py-2 text-lg font-medium text-blue-600 border-b-2 border-blue-600'
                : 'flex-1 py-2 text-lg font-medium text-gray-500';
            document.getElementById('ce-mistakes-tab').className = currentMistakeTab === 'ce'
                ? 'flex-1 py-2 text-lg font-medium text-blue-600 border-b-2 border-blue-600'
                : 'flex-1 py-2 text-lg font-medium text-gray-500';
            renderMistakesList();
        }

        function renderMistakesList() {
            const listDiv = document.getElementById('mistakes-list');
            const mistakes = currentMistakeTab === 'ec' 
                ? (currentList?.ecMistakes || [])
                : (currentList?.ceMistakes || []);
            
            if (mistakes.length === 0) {
                listDiv.innerHTML = '<p class="text-center text-gray-500 text-lg mt-8">暂无错题</p>';
                return;
            }

            listDiv.innerHTML = mistakes.map(m => `
                <div class="bg-white p-3 rounded-lg border border-gray-200">
                    <p class="text-lg">${m.english} - ${m.chinese}</p>
                    <p class="text-sm text-gray-500">连续正确: ${m.streak || 0}/3</p>
                </div>
            `).join('');
        }

        // 语音设置
        const rateSlider = document.getElementById('rate-slider');
        const volumeSlider = document.getElementById('volume-slider');
        const pitchSlider = document.getElementById('pitch-slider');

        rateSlider.addEventListener('input', () => {
            document.getElementById('rate-value').textContent = `${rateSlider.value}%`;
        });

        volumeSlider.addEventListener('input', () => {
            document.getElementById('volume-value').textContent = `${volumeSlider.value}%`;
        });

        pitchSlider.addEventListener('input', () => {
            document.getElementById('pitch-value').textContent = `${pitchSlider.value}Hz`;
        });

        document.getElementById('save-voice-btn').addEventListener('click', () => {
            data.voiceSettings = {
                rate: `${rateSlider.value >= 0 ? '+' : ''}${rateSlider.value}%`,
                volume: `${volumeSlider.value >= 0 ? '+' : ''}${volumeSlider.value}%`,
                pitch: `${pitchSlider.value >= 0 ? '+' : ''}${pitchSlider.value}Hz`
            };
            saveData();
            showToast('语音设置已保存');
        });

        // 语音播放
        async function playVoice(text) {
            try {
                const { rate, volume, pitch } = data.voiceSettings;
                const tts = new EdgeTTS();
                const audio = await tts.synthesize(text, {
                    voice: 'en-US-AriaNeural',
                    rate: rate,
                    volume: volume,
                    pitch: pitch
                });
                const audioUrl = URL.createObjectURL(audio);
                const audioElement = new Audio(audioUrl);
                audioElement.play();
                audioElement.onended = () => URL.revokeObjectURL(audioUrl);
            } catch (e) {
                console.error('播放失败:', e);
                showToast('语音播放失败，请检查网络');
            }
        }

        // 数据导出导入
        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `单词数据_${new Date().toLocaleDateString()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据导出成功');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    data = JSON.parse(e.target.result);
                    saveData();
                    refreshListSelect();
                    showToast('数据导入成功');
                } catch (err) {
                    showToast('导入失败，文件格式错误');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 工具函数
        function showModal(title, content, buttons) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-content').innerHTML = content;
            const buttonsDiv = document.getElementById('modal-buttons');
            buttonsDiv.innerHTML = '';
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = 'px-4 py-2 rounded-lg bg-blue-600 text-white';
                button.textContent = btn.text;
                button.onclick = btn.onClick;
                buttonsDiv.appendChild(button);
            });
            document.getElementById('modal').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function finishTest(type) {
            showModal('学习完成', `${type}学习已全部完成！`, [
                { text: '返回首页', onClick: () => { hideModal(); goHome(); } }
            ]);
        }

        // 初始化
        loadData();
        rateSlider.value = parseInt(data.voiceSettings.rate.replace(/[+%]/g, ''));
        volumeSlider.value = parseInt(data.voiceSettings.volume.replace(/[+%]/g, ''));
        pitchSlider.value = parseInt(data.voiceSettings.pitch.replace(/[+Hz]/g, ''));
        document.getElementById('rate-value').textContent = `${rateSlider.value}%`;
        document.getElementById('volume-value').textContent = `${volumeSlider.value}%`;
        document.getElementById('pitch-value').textContent = `${pitchSlider.value}Hz`;

        // 注册Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
