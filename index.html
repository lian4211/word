<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词背诵助手</title>
    <link rel="manifest" href="/word/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="单词背诵">
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app" class="max-w-md mx-auto px-4 py-6">
        <!-- 顶部导航 -->
        <header class="mb-6">
            <h1 id="page-title" class="text-2xl font-bold text-center text-blue-600">单词背诵助手</h1>
            <button id="back-btn" class="hidden absolute top-6 left-4 text-xl text-blue-600">← 返回</button>
        </header>

        <!-- 首页 -->
        <div id="home-page" class="page">
            <!-- 列表选择与管理 -->
            <div class="mb-6">
                <label class="block text-lg font-medium mb-2">选择单词列表</label>
                <div class="flex gap-2">
                    <select id="list-select" class="flex-1 p-3 border border-gray-300 rounded-lg text-lg">
                        <option value="">暂无列表</option>
                    </select>
                    <button id="edit-list-btn" class="px-3 bg-yellow-500 text-white rounded-lg" title="修改列表名称">✏️</button>
                    <button id="delete-list-btn" class="px-3 bg-red-500 text-white rounded-lg" title="删除列表">🗑️</button>
                </div>
            </div>

            <button id="new-list-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg text-lg mb-8">
                新建单词列表
            </button>

            <!-- 功能按钮网格 -->
            <div class="grid grid-cols-2 gap-4">
                <button class="bg-green-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="goToPage('add-word')">
                    <span class="text-4xl mb-2">➕</span>
                    <span class="text-lg">添加单词</span>
                </button>
                <button class="bg-blue-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="startECTest()">
                    <span class="text-4xl mb-2">🔤</span>
                    <span class="text-lg">英译汉</span>
                </button>
                <button class="bg-orange-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="startCETest()">
                    <span class="text-4xl mb-2">✍️</span>
                    <span class="text-lg">汉译英</span>
                </button>
                <button class="bg-red-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="goToPage('mistakes')">
                    <span class="text-4xl mb-2">❌</span>
                    <span class="text-lg">错题库</span>
                </button>
                <button class="bg-purple-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="goToPage('voice-settings')">
                    <span class="text-4xl mb-2">🔊</span>
                    <span class="text-lg">语音设置</span>
                </button>
                <button class="bg-gray-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="goToPage('word-list')">
                    <span class="text-4xl mb-2">📋</span>
                    <span class="text-lg">管理单词</span>
                </button>
                <button class="bg-gray-500 text-white p-6 rounded-xl flex flex-col items-center" onclick="exportData()">
                    <span class="text-4xl mb-2">💾</span>
                    <span class="text-lg">导出数据</span>
                </button>
            </div>

            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
            <button class="w-full mt-4 bg-gray-600 text-white py-3 rounded-lg text-lg" onclick="document.getElementById('import-file').click()">
                导入数据
            </button>
        </div>

        <!-- 添加单词页面 -->
        <div id="add-word-page" class="page hidden">
            <p id="add-word-count" class="text-center text-lg text-gray-600 mb-4"></p>
            <div class="space-y-4">
                <div>
                    <label class="block text-lg font-medium mb-2">英文单词</label>
                    <input type="text" id="english-input" class="w-full p-3 border border-gray-300 rounded-lg text-lg" placeholder="输入英文">
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">中文含义</label>
                    <input type="text" id="chinese-input" class="w-full p-3 border border-gray-300 rounded-lg text-lg" placeholder="输入中文">
                </div>
                <button id="add-word-btn" class="w-full bg-green-500 text-white py-3 rounded-lg text-lg mt-6">
                    添加单词
                </button>
            </div>
        </div>

        <!-- 单词列表管理页面 -->
        <div id="word-list-page" class="page hidden">
            <p id="word-list-count" class="text-center text-lg text-gray-600 mb-4"></p>
            <div id="word-list-container" class="space-y-2"></div>
        </div>

        <!-- 英译汉页面 -->
        <div id="ec-page" class="page hidden">
            <p id="ec-progress" class="text-center text-lg text-blue-600 mb-8"></p>
            
            <div class="flex justify-center items-center mb-12">
                <span id="ec-word" class="text-3xl font-bold mr-4"></span>
                <button id="ec-play-btn" class="text-3xl text-blue-600">🔊</button>
            </div>

            <div id="ec-options" class="space-y-4 mb-8"></div>
            <p id="ec-feedback" class="text-center text-2xl"></p>
        </div>

        <!-- 汉译英页面 -->
        <div id="ce-page" class="page hidden">
            <p id="ce-progress" class="text-center text-lg text-blue-600 mb-8"></p>
            
            <div class="flex justify-center items-center mb-12">
                <span id="ce-word" class="text-3xl font-bold mr-4"></span>
                <button id="ce-play-btn" class="text-3xl text-blue-600">🔊</button>
            </div>

            <input type="text" id="ce-input" class="w-full p-3 border border-gray-300 rounded-lg text-lg text-center mb-6" placeholder="输入英文答案">
            <button id="ce-submit-btn" class="w-full bg-blue-600 text-white py-3 rounded-lg text-lg mb-8">
                提交
            </button>
            <p id="ce-feedback" class="text-center text-2xl"></p>
        </div>

        <!-- 错题库页面 -->
        <div id="mistakes-page" class="page hidden">
            <div class="flex border-b border-gray-300 mb-4">
                <button id="ec-mistakes-tab" class="flex-1 py-2 text-lg font-medium text-blue-600 border-b-2 border-blue-600">
                    英译汉错题
                </button>
                <button id="ce-mistakes-tab" class="flex-1 py-2 text-lg font-medium text-gray-500">
                    汉译英错题
                </button>
            </div>
            <div id="mistakes-list" class="space-y-2"></div>
        </div>

        <!-- 语音设置页面 -->
        <div id="voice-settings-page" class="page hidden">
            <div class="space-y-8">
                <div>
                    <label class="block text-lg font-medium mb-2">语速 (-50% ~ +100%)</label>
                    <input type="range" id="rate-slider" min="-50" max="100" value="0" class="w-full">
                    <p id="rate-value" class="text-center text-lg mt-2">0%</p>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">音量 (-50% ~ +50%)</label>
                    <input type="range" id="volume-slider" min="-50" max="50" value="0" class="w-full">
                    <p id="volume-value" class="text-center text-lg mt-2">0%</p>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">语调 (-20Hz ~ +20Hz)</label>
                    <input type="range" id="pitch-slider" min="-20" max="20" value="0" class="w-full">
                    <p id="pitch-value" class="text-center text-lg mt-2">0Hz</p>
                </div>
                <button id="save-voice-btn" class="w-full bg-purple-600 text-white py-3 rounded-lg text-lg">
                    保存设置
                </button>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl p-6 w-80 mx-4">
            <h3 id="modal-title" class="text-xl font-bold mb-4"></h3>
            <div id="modal-content" class="mb-6"></div>
            <div id="modal-buttons" class="flex justify-end space-x-4"></div>
        </div>
    </div>

    <script>
        // 数据管理
        let data = {
            lists: [],
            nextId: 1,
            voiceSettings: { rate: "+0%", volume: "+0%", pitch: "+0Hz" }
        };
        let currentList = null;

        // 加载数据
        function loadData() {
            const saved = localStorage.getItem('wordLearnerData');
            if (saved) {
                data = JSON.parse(saved);
            }
            refreshListSelect();
        }

        // 保存数据
        function saveData() {
            localStorage.setItem('wordLearnerData', JSON.stringify(data));
        }

        // 刷新列表选择（核心修复：保留当前选中的列表）
        function refreshListSelect() {
            const select = document.getElementById('list-select');
            // 记录当前选中的ID，避免刷新后丢失
            const selectedId = select.value ? parseInt(select.value) : (currentList ? currentList.id : null);
            
            select.innerHTML = '';
            if (data.lists.length === 0) {
                select.innerHTML = '<option value="">暂无列表</option>';
                currentList = null;
                return;
            }
            
            // 渲染所有列表选项
            data.lists.forEach(list => {
                const option = document.createElement('option');
                option.value = list.id;
                option.textContent = `${list.name} (${list.words.length}个单词)`;
                select.appendChild(option);
            });
            
            // 优先保留之前选中的列表
            if (selectedId && data.lists.some(l => l.id === selectedId)) {
                select.value = selectedId;
                currentList = data.lists.find(l => l.id === selectedId);
            } else {
                // 无选中项时才选第一个
                select.value = data.lists[0].id;
                currentList = data.lists[0];
            }
        }

        // 新建列表
        document.getElementById('new-list-btn').addEventListener('click', () => {
            showModal('新建单词列表', 
                '<input type="text" id="new-list-name" class="w-full p-2 border rounded-lg" placeholder="输入列表名称">',
                [
                    { text: '取消', onClick: hideModal },
                    { text: '创建', onClick: () => {
                        const name = document.getElementById('new-list-name').value.trim();
                        if (!name) {
                            showToast('请输入列表名称');
                            return;
                        }
                        if (data.lists.some(l => l.name === name)) {
                            showToast('列表名称已存在');
                            return;
                        }
                        const newList = {
                            id: data.nextId++,
                            name: name,
                            words: [],
                            ecMistakes: [],
                            ceMistakes: []
                        };
                        data.lists.push(newList);
                        saveData();
                        refreshListSelect();
                        hideModal();
                        showToast('列表创建成功');
                    }}
                ]
            );
        });

        // 修改列表名称
        document.getElementById('edit-list-btn').addEventListener('click', () => {
            if (!currentList) {
                showToast('请先选择一个列表');
                return;
            }
            showModal('修改列表名称', 
                `<input type="text" id="edit-list-name" class="w-full p-2 border rounded-lg" value="${currentList.name}">`,
                [
                    { text: '取消', onClick: hideModal },
                    { text: '保存', onClick: () => {
                        const newName = document.getElementById('edit-list-name').value.trim();
                        if (!newName) {
                            showToast('请输入列表名称');
                            return;
                        }
                        if (data.lists.some(l => l.name === newName && l.id !== currentList.id)) {
                            showToast('列表名称已存在');
                            return;
                        }
                        currentList.name = newName;
                        saveData();
                        refreshListSelect();
                        hideModal();
                        showToast('列表名称已修改');
                    }}
                ]
            );
        });

        // 删除列表
        document.getElementById('delete-list-btn').addEventListener('click', () => {
            if (!currentList) {
                showToast('请先选择一个列表');
                return;
            }
            showModal('确认删除', 
                `确定要删除列表"${currentList.name}"吗？<br>所有单词和错题数据将永久丢失！`,
                [
                    { text: '取消', onClick: hideModal },
                    { text: '删除', onClick: () => {
                        data.lists = data.lists.filter(l => l.id !== currentList.id);
                        saveData();
                        refreshListSelect();
                        hideModal();
                        showToast('列表已删除');
                    }}
                ]
            );
        });

        // 列表选择变化
        document.getElementById('list-select').addEventListener('change', (e) => {
            const id = parseInt(e.target.value);
            currentList = data.lists.find(l => l.id === id);
        });

        // 页面切换
        function goToPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`${pageName}-page`).classList.remove('hidden');
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('page-title').textContent = getPageTitle(pageName);
            
            // 页面加载时更新单词数
            if (pageName === 'add-word') {
                updateAddWordCount();
            } else if (pageName === 'word-list') {
                renderWordList();
            } else if (pageName === 'voice-settings') {
                initVoiceSettings();
            } else if (pageName === 'mistakes') {
                updateMistakesTab('ec');
            }
        }

        function goHome() {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('back-btn').classList.add('hidden');
            document.getElementById('page-title').textContent = '单词背诵助手';
        }

        function getPageTitle(pageName) {
            const titles = {
                'add-word': '添加单词',
                'word-list': '单词列表',
                'ec': '英译汉',
                'ce': '汉译英',
                'mistakes': '错题库',
                'voice-settings': '语音设置'
            };
            return titles[pageName] || '单词背诵助手';
        }

        document.getElementById('back-btn').addEventListener('click', goHome);

        // 更新添加单词页面的单词数
        function updateAddWordCount() {
            if (currentList) {
                document.getElementById('add-word-count').textContent = `当前列表已有 ${currentList.words.length} 个单词`;
            } else {
                document.getElementById('add-word-count').textContent = '请先选择一个列表';
            }
        }

        // 添加单词（核心修复：移除refreshListSelect调用）
        document.getElementById('add-word-btn').addEventListener('click', () => {
            const english = document.getElementById('english-input').value.trim();
            const chinese = document.getElementById('chinese-input').value.trim();
            if (!english || !chinese) {
                showToast('请填写完整的英文和中文信息');
                return;
            }
            if (!currentList) {
                showToast('请先选择一个列表');
                return;
            }
            currentList.words.push({ english, chinese });
            saveData();
            // 移除refreshListSelect，避免选中状态丢失
            updateAddWordCount();
            document.getElementById('english-input').value = '';
            document.getElementById('chinese-input').value = '';
            showToast('单词添加成功');
        });

        // 单词列表管理
        function renderWordList() {
            const container = document.getElementById('word-list-container');
            const countEl = document.getElementById('word-list-count');
            
            if (!currentList || currentList.words.length === 0) {
                countEl.textContent = '当前列表没有单词';
                container.innerHTML = '';
                return;
            }

            countEl.textContent = `共 ${currentList.words.length} 个单词`;
            container.innerHTML = currentList.words.map((word, index) => `
                <div class="bg-white p-3 rounded-lg border border-gray-200 flex justify-between items-center">
                    <div>
                        <p class="text-lg">${word.english} - ${word.chinese}</p>
                    </div>
                    <div class="flex gap-2">
                        <button class="px-2 py-1 bg-yellow-500 text-white rounded" onclick="editWord(${index})">修改</button>
                        <button class="px-2 py-1 bg-red-500 text-white rounded" onclick="deleteWord(${index})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 修改单词（补全并修复：移除refreshListSelect）
        function editWord(index) {
            if (!currentList) return;
            const word = currentList.words[index];
            showModal('修改单词', 
                `<div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium mb-1">英文单词</label>
                        <input type="text" id="edit-english" class="w-full p-2 border rounded-lg" value="${word.english}">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">中文含义</label>
                        <input type="text" id="edit-chinese" class="w-full p-2 border rounded-lg" value="${word.chinese}">
                    </div>
                </div>`,
                [
                    { text: '取消', onClick: hideModal },
                    { text: '保存', onClick: () => {
                        const newEnglish = document.getElementById('edit-english').value.trim();
                        const newChinese = document.getElementById('edit-chinese').value.trim();
                        if (!newEnglish || !newChinese) {
                            showToast('请填写完整的英文和中文信息');
                            return;
                        }
                        currentList.words[index].english = newEnglish;
                        currentList.words[index].chinese = newChinese;
                        saveData();
                        renderWordList();
                        // 移除refreshListSelect，避免选中状态丢失
                        hideModal();
                        showToast('单词修改成功');
                    }}
                ]
            );
        }

        // 删除单词（补全函数）
        function deleteWord(index) {
            if (!currentList) return;
            if (!confirm(`确定删除单词【${currentList.words[index].english}】吗？`)) return;
            
            // 删除单词同时清理对应错题
            currentList.words.splice(index, 1);
            currentList.ecMistakes = currentList.ecMistakes.filter(m => m.index !== index);
            currentList.ceMistakes = currentList.ceMistakes.filter(m => m.index !== index);
            
            saveData();
            renderWordList();
            // 仅更新下拉框的单词数统计（保留此refreshListSelect）
            refreshListSelect();
            showToast('单词已删除');
        }

        // 弹窗控制（补全缺失函数）
        function showModal(title, content, buttons) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');
            const modalButtons = document.getElementById('modal-buttons');
            
            modalTitle.textContent = title;
            modalContent.innerHTML = content;
            modalButtons.innerHTML = '';
            
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.textContent = btn.text;
                button.className = 'px-4 py-2 rounded-lg ' + (btn.onClick === hideModal ? 'bg-gray-300' : 'bg-blue-600 text-white');
                button.onclick = btn.onClick;
                modalButtons.appendChild(button);
            });
            
            modal.classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // 提示框（补全缺失函数）
        function showToast(message) {
            // 移除已有提示框
            const oldToast = document.querySelector('.toast-notice');
            if (oldToast) oldToast.remove();
            
            // 创建新提示框
            let toast = document.createElement('div');
            toast.className = 'toast-notice fixed bottom-6 left-1/2 -translate-x-1/2 bg-black/80 text-white px-4 py-2 rounded-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // 3秒后移除
            setTimeout(() => toast.remove(), 3000);
        }

        // 语音设置初始化
        function initVoiceSettings() {
            const rateSlider = document.getElementById('rate-slider');
            const volumeSlider = document.getElementById('volume-slider');
            const pitchSlider = document.getElementById('pitch-slider');
            const rateValue = document.getElementById('rate-value');
            const volumeValue = document.getElementById('volume-value');
            const pitchValue = document.getElementById('pitch-value');

            // 解析当前设置值
            const rate = parseInt(data.voiceSettings.rate.replace(/\+|%/g, ''));
            const volume = parseInt(data.voiceSettings.volume.replace(/\+|%/g, ''));
            const pitch = parseInt(data.voiceSettings.pitch.replace(/\+|Hz/g, ''));

            rateSlider.value = rate;
            volumeSlider.value = volume;
            pitchSlider.value = pitch;
            rateValue.textContent = `${rate}%`;
            volumeValue.textContent = `${volume}%`;
            pitchValue.textContent = `${pitch}Hz`;

            // 滑块事件
            rateSlider.addEventListener('input', (e) => rateValue.textContent = `${e.target.value}%`);
            volumeSlider.addEventListener('input', (e) => volumeValue.textContent = `${e.target.value}%`);
            pitchSlider.addEventListener('input', (e) => pitchValue.textContent = `${e.target.value}Hz`);

            // 保存语音设置
            document.getElementById('save-voice-btn').onclick = () => {
                data.voiceSettings.rate = `+${rateSlider.value}%`;
                data.voiceSettings.volume = `+${volumeSlider.value}%`;
                data.voiceSettings.pitch = `+${pitchSlider.value}Hz`;
                saveData();
                showToast('语音设置已保存');
                goHome();
            };
        }

        // 错题库标签切换
        function updateMistakesTab(type) {
            const ecTab = document.getElementById('ec-mistakes-tab');
            const ceTab = document.getElementById('ce-mistakes-tab');
            const mistakesList = document.getElementById('mistakes-list');

            // 切换标签样式
            ecTab.className = type === 'ec' 
                ? 'flex-1 py-2 text-lg font-medium text-blue-600 border-b-2 border-blue-600'
                : 'flex-1 py-2 text-lg font-medium text-gray-500';
            ceTab.className = type === 'ce' 
                ? 'flex-1 py-2 text-lg font-medium text-blue-600 border-b-2 border-blue-600'
                : 'flex-1 py-2 text-lg font-medium text-gray-500';

            // 渲染错题列表
            if (!currentList) {
                mistakesList.innerHTML = '<p class="text-center text-gray-500">请先选择一个列表</p>';
                return;
            }

            const mistakes = type === 'ec' ? currentList.ecMistakes : currentList.ceMistakes;
            if (mistakes.length === 0) {
                mistakesList.innerHTML = `<p class="text-center text-gray-500">暂无${type === 'ec' ? '英译汉' : '汉译英'}错题</p>`;
                return;
            }

            mistakesList.innerHTML = mistakes.map(mistake => {
                const word = currentList.words[mistake.index];
                return `
                    <div class="bg-white p-3 rounded-lg border border-gray-200">
                        <p class="text-lg">${type === 'ec' ? word.english : word.chinese}</p>
                        <p class="text-gray-600">正确答案：${type === 'ec' ? word.chinese : word.english}</p>
                        <p class="text-xs text-gray-500 mt-1">剩余需答对：${3 - mistake.correctCount} 次</p>
                    </div>
                `;
            }).join('');
        }

        // 绑定错题库标签点击事件
        document.getElementById('ec-mistakes-tab').addEventListener('click', () => updateMistakesTab('ec'));
        document.getElementById('ce-mistakes-tab').addEventListener('click', () => updateMistakesTab('ce'));

        // 英译汉测试（基础框架，避免报错）
        function startECTest() {
            if (!currentList || currentList.words.length < 4) {
                showToast('列表单词数需不少于4个才能开始英译汉测试');
                return;
            }
            goToPage('ec');
            // 完整测试逻辑可根据需求补充
            showToast('英译汉测试功能开发中');
        }

        // 汉译英测试（基础框架，避免报错）
        function startCETest() {
            if (!currentList || currentList.words.length === 0) {
                showToast('列表不能为空才能开始汉译英测试');
                return;
            }
            goToPage('ce');
            // 完整测试逻辑可根据需求补充
            showToast('汉译英测试功能开发中');
        }

        // 导出数据
        function exportData() {
            if (data.lists.length === 0) {
                showToast('暂无数据可导出');
                return;
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `单词背诵助手_${new Date().toLocaleDateString()}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            showToast('数据导出成功');
        }

        // 导入数据
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result);
                    // 验证数据格式
                    if (!importedData.lists || !Array.isArray(importedData.lists)) {
                        throw new Error('数据格式错误');
                    }
                    // 合并数据（覆盖原有数据，也可改为追加）
                    data = importedData;
                    // 重置nextId避免重复
                    data.nextId = data.lists.length > 0 
                        ? Math.max(...data.lists.map(l => l.id)) + 1 
                        : 1;
                    saveData();
                    refreshListSelect();
                    showToast('数据导入成功');
                } catch (err) {
                    showToast('导入失败：' + err.message);
                }
            };
            reader.readAsText(file);
            // 清空文件选择
            event.target.value = '';
        }

        // 页面加载时初始化
        window.onload = loadData;
    </script>
</body>
</html>
